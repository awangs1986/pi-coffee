<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>PI Coffee</title>
    <script>
      // Keep the shell light by default; remember an explicit dark-mode choice.
      (() => { try { document.documentElement.dataset.theme = localStorage.getItem('pi-coffee.theme.v1') === 'dark' ? 'dark' : 'light'; } catch { document.documentElement.dataset.theme = 'light'; } })();
    </script>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <div class="app" id="app">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-head">
          <div class="brand-wrap">
            <button class="brand" id="brand-menu-btn" type="button" aria-haspopup="menu" aria-expanded="false" title="PI-COFFEE 设置">
              <span class="brand-mark">π</span>
              <span class="brand-title">PI-COFFEE</span>
              <svg class="brand-caret" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="brand-menu hidden" id="brand-menu" role="menu" aria-label="PI-COFFEE 设置">
              <div class="brand-menu-label">设置</div>
              <button class="brand-menu-item theme-toggle" id="theme-toggle" type="button" role="menuitem" aria-pressed="false">
                <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
                <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                <span id="theme-toggle-label">深色模式</span>
              </button>
              <button class="brand-menu-item" id="plugins-btn" type="button" role="menuitem">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/><circle cx="12" cy="12" r="3.5"/></svg>
                <span>插件</span>
              </button>
              <div class="brand-menu-foot">更多设置将放在这里</div>
            </div>
          </div>
          <button class="icon-btn side-collapse" id="close-side" type="button" aria-label="折叠侧栏" title="折叠侧栏">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M10 4v16M14 12h-4M7 12h1"/></svg>
          </button>
        </div>
        <button class="new-task" id="new-task" type="button" title="新对话 (Ctrl/⌘+K)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          新对话
        </button>
        <div class="search">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="search" type="search" placeholder="搜索对话" aria-label="搜索对话" autocomplete="off" />
        </div>
        <div class="session-scroll">
          <ul class="session-list" id="session-list"></ul>
        </div>
        <div class="sidebar-foot">
          <span id="dot" class="dot"></span><span id="status" class="status-text">连接中…</span>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <button class="icon-btn menu" id="open-side" type="button" aria-label="打开侧栏">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </button>
          <button class="topbar-title" id="title" type="button" title="点击重命名">新对话</button>
          <div class="ext-status" id="ext-status"></div>
          <div class="topbar-state" id="topbar-state"></div>
          <div class="stats-wrap" id="stats-wrap">
            <button class="chip-btn hidden" id="stats" type="button" aria-haspopup="dialog" aria-expanded="false" title="上下文用量"></button>
            <div class="stats-pop hidden" id="stats-pop" role="dialog" aria-label="上下文用量">
              <div class="stats-head"><span>上下文用量</span><span class="stats-num" id="sp-pct"></span></div>
              <div class="stats-sub"><span id="sp-fill"></span><span id="sp-window"></span></div>
              <div class="stats-bar" id="sp-bar"><span class="seg used"></span></div>
              <div class="stats-legend" id="sp-legend"></div>
              <div class="stats-foot">
                <span id="sp-cost"></span>
                <button type="button" class="btn small" id="sp-compact">本地压缩上下文</button>
              </div>
              <div class="stats-note">占用与用量由 User VM 中的 Pi 统计；Pi 不区分系统提示 / 工具定义 / 对话三段。</div>
            </div>
          </div>
          <button id="merge-workspace" class="btn small hidden">查看合并</button>
          <button id="files-toggle" class="btn small">工作树</button>
          <div class="topbar-meta" id="session-meta"></div>
        </header>
        <div class="conn-banner hidden" id="conn-banner" role="status">连接已断开，正在自动重连…（Host 上的任务不会被打断）</div>

        <div class="scroller" id="scroller">
          <div class="thread" id="thread"></div>
        </div>
        <button class="to-bottom hidden" id="to-bottom" type="button" aria-label="滚动到底部">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
        </button>

        <div class="composer-wrap">
          <div class="widgets hidden" id="widgets"></div>
          <div class="queue hidden" id="queue"></div>
          <div class="slash hidden" id="slash" role="listbox"></div>
          <form class="composer" id="composer" aria-label="消息输入">
            <div class="attachments hidden" id="attachments" aria-label="附件" aria-live="polite"></div>
            <textarea id="prompt" rows="2" placeholder="给 PI Coffee 发消息…" aria-label="输入"></textarea>
            <div class="composer-bar">
              <div class="composer-left">
                <button class="icon-btn small" id="attach" type="button" title="上传附件" aria-label="上传附件">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.4 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.2-9.19a4 4 0 0 1 5.65 5.66l-9.2 9.19a2 2 0 0 1-2.82-2.83l8.48-8.48"/></svg>
                </button>
                <div class="agent-menu-wrap">
                  <button class="agent-trigger" id="agent-menu-btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="agent-menu" title="Agent 设置">
                    <span>Agent</span><span class="agent-caret" aria-hidden="true">⌄</span>
                  </button>
                  <div class="agent-menu hidden" id="agent-menu" role="menu" aria-label="Agent 设置">
                    <div class="agent-menu-list">
                      <button class="agent-menu-row" id="agent-source-row" type="button" role="menuitem" aria-haspopup="menu" aria-expanded="false"><span>来源</span><span class="agent-row-value"><span id="agent-source-value">Native</span><span aria-hidden="true">›</span></span></button>
                      <button class="agent-menu-row" id="agent-model-row" type="button" role="menuitem" aria-haspopup="menu" aria-expanded="false"><span>模型</span><span class="agent-row-value"><span id="agent-model-value">—</span><span aria-hidden="true">›</span></span></button>
                      <button class="agent-menu-row hidden" id="agent-thinking-row" type="button" role="menuitem" aria-haspopup="menu" aria-expanded="false"><span>思考深度</span><span class="agent-row-value"><span id="agent-thinking-value">—</span><span aria-hidden="true">›</span></span></button>
                    </div>
                    <div class="agent-pane hidden" id="agent-source-pane" role="menu" aria-label="模型来源"></div>
                    <div class="agent-pane hidden" id="agent-model-pane" role="menu" aria-label="模型"></div>
                    <div class="agent-pane hidden" id="agent-thinking-pane" role="menu" aria-label="思考深度"></div>
                  </div>
                </div>
                <span class="hint" id="hint" aria-live="polite">Enter 发送 · Shift+Enter 换行</span>
              </div>
              <div class="composer-right">
                <label class="select-wrap hidden" id="mode-wrap" title="运行中发送方式">
                  <select id="mode" aria-label="运行中发送方式">
                    <option value="follow_up">排队</option>
                    <option value="steer">插话</option>
                  </select>
                </label>
                <button class="stop hidden" id="stop" type="button" aria-label="停止" title="停止 (Esc)">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
                </button>
                <button class="send" id="send" type="submit" disabled aria-label="发送" title="发送">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
                </button>
              </div>
            </div>
            <div class="sr-only" aria-hidden="true">
              <input id="file" type="file" multiple tabindex="-1" />
              <label>模型来源<select id="model-source" tabindex="-1"><option value="native">原生 Pi</option><option value="relay">管理员 Relay</option></select></label>
              <label>模型<select id="model" tabindex="-1"><option value="">模型…</option></select></label>
              <label>思考深度<select id="thinking" tabindex="-1"><option value="">思考…</option></select></label>
            </div>
          </form>
          <section id="project-controls" class="project-context hidden" aria-label="Gitea 仓库和分支">
            <span class="context-icon" aria-hidden="true">▦</span>
            <label class="context-field context-repo">
              <span class="sr-only">Gitea 仓库</span>
              <select id="project-select" aria-label="Gitea 仓库"><option value="">选择仓库</option></select>
            </label>
            <span class="context-sep" aria-hidden="true">/</span>
            <label class="context-field context-branch">
              <span class="context-branch-mark" aria-hidden="true">⎇</span>
              <input id="start-branch" placeholder="默认项目分支" aria-label="起始分支" />
            </label>
            <details class="project-manage">
              <summary title="项目与归档管理">管理</summary>
              <div class="project-manage-menu" role="menu">
                <button id="project-add" type="button" role="menuitem">＋ 项目</button>
                <button id="project-discover" type="button" role="menuitem">发现已有项目</button>
                <button id="show-active" type="button" role="menuitem">活动对话</button>
                <button id="show-archive" type="button" role="menuitem">归档对话</button>
              </div>
            </details>
          </section>
        </div>
      </main>
      <aside id="workspace-panel" class="workspace-panel hidden" aria-label="工作区变更审查">
        <header class="wt-header">
          <div class="wt-tabs" role="tablist" aria-label="工作区审查">
            <button id="files-diff" class="wt-tab active" type="button" role="tab" aria-selected="true">Diff <span id="workspace-summary" class="wt-summary"></span></button>
            <button id="files-checks" class="wt-tab" type="button" role="tab" aria-selected="false">Checks</button>
          </div>
          <div class="wt-actions">
            <button id="wt-download" class="icon-btn small" type="button" aria-label="下载全部变更补丁" title="下载全部变更补丁"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg></button>
            <button id="files-close" class="icon-btn small" type="button" aria-label="关闭工作树面板" title="关闭"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
          </div>
        </header>
        <div id="workspace-list" class="workspace-list" aria-label="变更文件列表"><p class="workspace-empty">打开项目对话以查看变更。</p></div>
        <div id="workspace-detail" class="workspace-detail hidden" aria-live="polite"></div>
        <footer class="wt-footer">
          <button id="view-all-changes" class="wt-all" type="button">View all changes<span class="wt-caret" aria-hidden="true">›</span></button>
        </footer>
      </aside>
    </div>

    <div class="modal-backdrop hidden" id="modal">
      <div class="modal" role="dialog" aria-modal="true">
        <h2 id="modal-title"></h2>
        <p id="modal-text"></p>
        <input id="modal-input" class="hidden" type="text" />
        <div class="modal-actions">
          <button type="button" class="btn" id="modal-cancel">取消</button>
          <button type="button" class="btn primary" id="modal-ok">确定</button>
        </div>
      </div>
    </div>

    <!-- Plugins panel: what the User VM's Pi has loaded -->
    <div class="modal-backdrop hidden" id="plugins-modal">
      <div class="modal plugins" role="dialog" aria-modal="true" aria-labelledby="plugins-title">
        <div class="plugins-head">
          <h2 id="plugins-title">插件</h2>
          <span class="plugins-sub" id="plugins-sub"></span>
          <button type="button" class="icon-btn" id="plugins-close" aria-label="关闭">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="plugins-body" id="plugins-body"></div>
        <div class="stats-note">列表来自当前对话的 Pi 进程（User VM 内）实际加载的内容；扩展按注册命令的源文件分组，PI Coffee 通过 <code>--extension</code> 传入的扩展即使没有命令也会显示。</div>
      </div>
    </div>

    <!-- Extension dialogs (Pi ctx.ui.select / confirm / input / editor) -->
    <div class="modal-backdrop hidden" id="ui-modal">
      <div class="modal ui-dialog" role="dialog" aria-modal="true" aria-labelledby="ui-title">
        <div class="ui-badge">扩展请求</div>
        <h2 id="ui-title"></h2>
        <p id="ui-text"></p>
        <div id="ui-options" class="ui-options hidden" role="listbox"></div>
        <input id="ui-input" class="hidden" type="text" />
        <textarea id="ui-editor" class="hidden" rows="8"></textarea>
        <div class="ui-meta" id="ui-meta"></div>
        <div class="modal-actions">
          <button type="button" class="btn" id="ui-cancel">取消</button>
          <button type="button" class="btn" id="ui-no">否</button>
          <button type="button" class="btn primary" id="ui-ok">确定</button>
        </div>
      </div>
    </div>
    <div class="toast hidden" id="toast"></div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
