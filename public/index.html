<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>PI Coffee</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <div class="app" id="app">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-head">
          <div class="brand"><span class="brand-mark">π</span><span>PI Coffee</span></div>
          <button class="icon-btn" id="close-side" type="button" aria-label="收起侧栏" title="收起侧栏">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <button class="new-task" id="new-task" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          新对话
        </button>
        <div class="side-label">对话</div>
        <ul class="session-list" id="session-list"></ul>
        <div class="sidebar-foot"><span id="dot" class="dot"></span><span id="status">连接中…</span></div>
      </aside>

      <main class="main">
        <header class="topbar">
          <button class="icon-btn menu" id="open-side" type="button" aria-label="打开侧栏">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </button>
          <div class="topbar-title" id="title">新对话</div>
          <div class="topbar-state" id="topbar-state"></div>
          <div class="topbar-meta" id="session-meta"></div>
        </header>

        <div class="scroller" id="scroller">
          <div class="thread" id="thread"></div>
        </div>

        <div class="composer-wrap">
          <form class="composer" id="composer">
            <textarea id="prompt" rows="1" placeholder="给 Pi 一个任务…" aria-label="输入"></textarea>
            <div class="composer-bar">
              <span class="hint">Enter 发送 · Shift+Enter 换行</span>
              <div>
                <button class="stop hidden" id="stop" type="button" aria-label="停止" title="停止">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
                </button>
                <button class="send" id="send" type="submit" disabled aria-label="发送" title="发送">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
                </button>
              </div>
            </div>
          </form>
          <div class="footnote">对话由 User VM 中的原版 Pi agent 执行；关闭页面不会中断正在运行的任务。</div>
        </div>
      </main>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
