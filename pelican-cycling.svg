    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#f8eedc"/><stop offset="1" stop-color="#fff9ee"/></linearGradient>
    <linearGradient id="pouch" x2="0.3" y2="1"><stop stop-color="#ffc765"/><stop offset="1" stop-color="#ed9952"/></linearGradient>
    <pattern id="grain" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r=".65" fill="#716951" opacity=".075"/><circle cx="7" cy="8" r=".45" fill="#716951" opacity=".06"/></pattern>
  </defs>
